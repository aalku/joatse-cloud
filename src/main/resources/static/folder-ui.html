<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Browser</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./folder-ui.css">
</head>
<body>
    <div class="container-fluid mt-3">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">File Browser</h5>
            </div>
            <div class="card-body">
                <!-- Toolbar -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <nav aria-label="breadcrumb" class="mb-0">
                        <ol class="breadcrumb mb-0" id="breadcrumb">
                            <li class="breadcrumb-item"><a href="#" data-path="/">Root</a></li>
                        </ol>
                    </nav>
                    <div class="btn-group" id="toolbar">
                        <!-- Hidden file input for upload -->
                        <input type="file" id="upload-file-input" style="display: none;" multiple>
                        <button type="button" class="btn btn-primary" id="upload-btn" title="Upload files">
                            📤 Upload
                        </button>
                        <button type="button" class="btn btn-success" id="new-folder-btn" title="Create folder">
                            📁 New Folder
                        </button>
                    </div>
                </div>
                
                <!-- Loading indicator -->
                <div id="loading" class="text-center py-5" style="display: none;">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
                
                <!-- Error message -->
                <div id="error" class="alert alert-danger" style="display: none;"></div>
                
                <!-- File list table -->
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Size</th>
                                <th>Modified</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="file-list">
                            <!-- Files will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="./lib/bootstrap.bundle.min.js"></script>
    <script src="./folder-ui.js"></script>
</body>
</html>
